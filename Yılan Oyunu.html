<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yılan Oyunu</title>
<style>
:root{--bg:#f4f1ea;--fg:#1d1d1b;--board:#e6e1d4;--snake:#2f7d4f;--head:#1f5c38;--food:#c8402f;--btn:#d8d2c2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#161814;--fg:#ecebe4;--board:#23261f;--snake:#58b87a;--head:#8fe0a9;--food:#ef6a58;--btn:#34382f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#161814;--fg:#ecebe4;--board:#23261f;--snake:#58b87a;--head:#8fe0a9;--food:#ef6a58;--btn:#34382f;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;user-select:none;-webkit-user-select:none;touch-action:none;overflow:hidden}
h1{font-size:20px;margin:0}
#bar{display:flex;gap:24px;font-size:16px}
canvas{background:var(--board);border-radius:10px;touch-action:none}
#pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(2,64px);gap:8px}
#pad button{background:var(--btn);color:var(--fg);border:0;border-radius:14px;font-size:26px;touch-action:none}
#pad button:active{filter:brightness(.85)}
#up{grid-column:2;grid-row:1}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}
</style>
</head>
<body>
<h1>🐍 Yılan Oyunu</h1>
<div id="bar"><span>Skor: <b id="score">0</b></span><span>En yüksek: <b id="best">0</b></span></div>
<canvas id="c"></canvas>
<div id="pad">
<button id="up" aria-label="Yukarı">▲</button>
<button id="left" aria-label="Sol">◀</button>
<button id="down" aria-label="Aşağı">▼</button>
<button id="right" aria-label="Sağ">▶</button>
</div>
<script>
(function(){
var N=20,cv=document.getElementById('c'),ctx=cv.getContext('2d'),cell=16;
var scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
var snake,dir,queue,food,score,best=0,state='ready',timer=null;
try{best=parseInt(localStorage.getItem('yilan-best'),10)||0}catch(e){}
bestEl.textContent=best;

function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function resize(){
  var s=Math.min(window.innerWidth-24,window.innerHeight-300,440);
  cell=Math.max(10,Math.floor(s/N));
  cv.width=cv.height=cell*N;
  cv.style.width=cv.style.height=cell*N+'px';
  draw();
}
function reset(){
  snake=[{x:10,y:10},{x:9,y:10},{x:8,y:10}];
  dir={x:1,y:0};queue=[];score=0;scoreEl.textContent=0;placeFood();
}
function placeFood(){
  var p;
  do{p={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N)}}
  while(snake.some(function(s){return s.x===p.x&&s.y===p.y}));
  food=p;
}
function turn(x,y){
  if(state==='ready'||state==='over'){start();}
  var last=queue.length?queue[queue.length-1]:dir;
  if(last.x===-x&&last.y===-y)return;
  if(last.x===x&&last.y===y)return;
  if(queue.length<3)queue.push({x:x,y:y});
}
function start(){
  if(state==='running')return;
  reset();state='running';loop();
}
function loop(){
  step();draw();
  if(state==='running'){timer=setTimeout(loop,Math.max(60,150-score*2))}
}
function step(){
  if(queue.length)dir=queue.shift();
  var h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
  var eat=h.x===food.x&&h.y===food.y;
  var body=eat?snake:snake.slice(0,-1);
  if(h.x<0||h.y<0||h.x>=N||h.y>=N||body.some(function(s){return s.x===h.x&&s.y===h.y})){
    state='over';
    if(score>best){best=score;bestEl.textContent=best;try{localStorage.setItem('yilan-best',best)}catch(e){}}
    if(navigator.vibrate)navigator.vibrate(200);
    return;
  }
  snake.unshift(h);
  if(eat){score+=10;scoreEl.textContent=score;placeFood()}else{snake.pop()}
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  if(!snake)reset();
  ctx.fillStyle=css('--food');
  ctx.beginPath();ctx.arc(food.x*cell+cell/2,food.y*cell+cell/2,cell*0.38,0,Math.PI*2);ctx.fill();
  snake.forEach(function(s,i){
    ctx.fillStyle=i===0?css('--head'):css('--snake');
    ctx.fillRect(s.x*cell+1,s.y*cell+1,cell-2,cell-2);
  });
  if(state!=='running'){
    ctx.fillStyle='rgba(0,0,0,0.45)';ctx.fillRect(0,0,cv.width,cv.height);
    ctx.fillStyle='#fff';ctx.textAlign='center';
    ctx.font='bold '+Math.round(cell*1.1)+'px system-ui,sans-serif';
    ctx.fillText(state==='over'?'Oyun bitti! Skor: '+score:'Başlamak için dokun',cv.width/2,cv.height/2-6);
    ctx.font=Math.round(cell*0.8)+'px system-ui,sans-serif';
    ctx.fillText(state==='over'?'Tekrar için dokun':'Kaydır veya oklara bas',cv.width/2,cv.height/2+cell);
  }
}
// Klavye
document.addEventListener('keydown',function(e){
  var m={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],w:[0,-1],s:[0,1],a:[-1,0],d:[1,0],W:[0,-1],S:[0,1],A:[-1,0],D:[1,0]}[e.key];
  if(m){e.preventDefault();turn(m[0],m[1])}
  else if(e.key===' '||e.key==='Enter'){start()}
});
// Ekran düğmeleri
[['up',0,-1],['down',0,1],['left',-1,0],['right',1,0]].forEach(function(b){
  document.getElementById(b[0]).addEventListener('pointerdown',function(e){e.preventDefault();turn(b[1],b[2])});
});
// Kaydırma ve dokunma
var sx=0,sy=0;
cv.addEventListener('touchstart',function(e){var t=e.touches[0];sx=t.clientX;sy=t.clientY;e.preventDefault()},{passive:false});
cv.addEventListener('touchend',function(e){
  var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<20&&Math.abs(dy)<20){start();return}
  if(Math.abs(dx)>Math.abs(dy))turn(dx>0?1:-1,0);else turn(0,dy>0?1:-1);
  e.preventDefault();
},{passive:false});
cv.addEventListener('click',function(){start()});
window.addEventListener('resize',resize);
resize();
})();
</script>
</body>
</html>
